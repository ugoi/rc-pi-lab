<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pi 3 – gemessener virtueller Servo</title>
<style>body{margin:0;background:#102033;color:#eaf5ff;font:17px system-ui;max-width:960px;padding:28px;margin:auto}canvas{width:100%;background:#172d43;border-radius:18px}button,input{margin:12px 10px 12px 0}button{font:inherit;padding:10px 20px;border:0;border-radius:9px;background:#ffd080}input{width:65%}small{color:#a8c4dd}pre{white-space:pre-wrap}</style>
<h1>Pi 3 → Linux-I2C → PCA9685 → Servo</h1><p>Anzeige aus protokollierten Geräte-Registern und PWM-Pulsbreiten.</p>
<canvas width="900" height="420" id="view"></canvas><button id="play">Abspielen</button><input id="seek" type="range" min="0" value="0" step="1"><pre id="info"></pre><small>Ideales Stellungsmodell: 1000–2000 µs = 0–180°. Keine gemessene Hardwarekalibrierung, Last- oder Fahrphysik. Wiedergabe: 2 Sekunden je Zustand; keine Echtzeitmessung.</small>
<script type="application/json" id="measurements">MEASUREMENTS_JSON</script>
<script>const rows=JSON.parse(document.querySelector('#measurements').textContent),c=document.querySelector('#view'),g=c.getContext('2d'),seek=document.querySelector('#seek');seek.max=rows.length-1;let timer;
function show(i){const r=rows[i],us=r.high_us[0],valid=us>=800&&us<=2200&&r.period_us>=15000&&r.period_us<=25000,a=Math.max(0,Math.min(180,(us-1000)*.18));g.clearRect(0,0,900,420);g.fillStyle='#2d7a9d';g.fillRect(300,240,300,130);g.strokeStyle='#74b7df';g.lineWidth=2;g.beginPath();g.arc(450,260,190,Math.PI,2*Math.PI);g.stroke();g.font='24px system-ui';g.fillStyle='#dae9f5';g.fillText('0°',230,285);g.fillText('90°',425,45);g.fillText('180°',635,285);g.fillText('VIRTUELLER SERVO',332,344);if(valid){const t=(180-a)*Math.PI/180;g.lineWidth=18;g.strokeStyle='#ffc66b';g.beginPath();g.moveTo(450,260);g.lineTo(450+160*Math.cos(t),260-160*Math.sin(t));g.stroke()}g.fillStyle='white';g.beginPath();g.arc(450,260,15,0,7);g.fill();document.querySelector('#info').textContent=`Zustand ${i+1}/${rows.length} · seq ${r.seq} · ${r.event}\nPWM ${us.toFixed(2)} µs / ${r.period_us.toFixed(2)} µs · virtuelle Zeit ${(r.ns/1e9).toFixed(3)} s\n${valid?'Idealer Winkel '+a.toFixed(2)+'°':'Kein gültiger Servopuls – keine Positionsaussage'}`;seek.value=i}
seek.oninput=()=>show(+seek.value);document.querySelector('#play').onclick=()=>{if(timer){clearInterval(timer);timer=null;document.querySelector('#play').textContent='Abspielen'}else{timer=setInterval(()=>show((+seek.value+1)%rows.length),2000);document.querySelector('#play').textContent='Pause'}};show(0)</script></html>
